name: Publish Python package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import runpy
          version = runpy.run_path('src/cleardocs/__init__.py')['__version__']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
          cd "$(mktemp -d)"
          cleardocs --version
          cleardocs init --template standard --hosting github-pages
          cleardocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cleardocs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
